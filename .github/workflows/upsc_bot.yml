name: UPSC Telegram Digest

on:
  schedule:
    # Runs daily at 9:00 AM IST (03:30 UTC) and 7:00 PM IST (13:30 UTC)
    - cron: '30 3 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch: # Lets you run it manually anytime to test

permissions:
  contents: write

jobs:
  post-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UPSC News Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save posted history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet || git commit -m "Update posted news log"
          git push
